<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>綾時屋サポート</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
}


/* =========================
   チャットボタン
========================= */

.chat-button {
    position: fixed;
    right: 25px;
    bottom: 25px;

    width: 65px;
    height: 65px;

    border: none;
    border-radius: 50%;

    background: #526f56;
    color: white;

    font-size: 28px;

    cursor: pointer;

    box-shadow: 0 4px 15px rgba(0,0,0,0.2);

    z-index: 9999;

    transition: 0.2s;
}

.chat-button:hover {
    transform: scale(1.05);
}


/* =========================
   チャット画面
========================= */

.chat-window {

    position: fixed;

    right: 25px;
    bottom: 100px;

    width: 360px;
    height: 520px;

    background: white;

    border-radius: 15px;

    box-shadow: 0 5px 25px rgba(0,0,0,0.25);

    overflow: hidden;

    display: none;

    flex-direction: column;

    z-index: 9998;
}


/* =========================
   ヘッダー
========================= */

.chat-header {

    background: #526f56;

    color: white;

    padding: 16px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.chat-header-title {

    font-weight: bold;

    font-size: 16px;
}

.chat-close {

    background: none;

    border: none;

    color: white;

    font-size: 20px;

    cursor: pointer;
}


/* =========================
   メッセージエリア
========================= */

.chat-messages {

    flex: 1;

    padding: 15px;

    overflow-y: auto;

    background: #f7f7f5;
}


/* =========================
   メッセージ
========================= */

.message {

    max-width: 82%;

    padding: 10px 13px;

    margin-bottom: 10px;

    border-radius: 12px;

    font-size: 14px;

    line-height: 1.6;
}

.bot-message {

    background: white;

    border: 1px solid #e1e1e1;

    margin-right: auto;
}

.user-message {

    background: #526f56;

    color: white;

    margin-left: auto;
}


/* =========================
   選択ボタン
========================= */

.quick-buttons {

    padding: 10px;

    background: white;

    border-top: 1px solid #ddd;

    display: flex;

    flex-wrap: wrap;

    gap: 6px;
}

.quick-buttons button {

    background: #f1f3ef;

    border: 1px solid #d6dcd4;

    border-radius: 20px;

    padding: 7px 10px;

    font-size: 12px;

    cursor: pointer;

    color: #405544;
}

.quick-buttons button:hover {

    background: #e2e9e1;
}


/* =========================
   入力欄
========================= */

.chat-input-area {

    display: flex;

    border-top: 1px solid #ddd;

    background: white;
}

.chat-input {

    flex: 1;

    border: none;

    padding: 13px;

    outline: none;

    font-size: 14px;
}

.send-button {

    width: 65px;

    border: none;

    background: #526f56;

    color: white;

    cursor: pointer;
}

.send-button:hover {

    background: #405744;
}


/* =========================
   スマホ対応
========================= */

@media (max-width: 600px) {

    .chat-window {

        right: 10px;
        bottom: 85px;

        width: calc(100% - 20px);

        height: 70vh;
    }

    .chat-button {

        right: 15px;
        bottom: 15px;
    }

}

</style>
</head>


<body>


<!-- =========================
     チャットボタン
========================= -->

<button
    class="chat-button"
    onclick="toggleChat()"
    aria-label="綾時屋サポートを開く">

    💬

</button>


<!-- =========================
     チャットウィンドウ
========================= -->

<div
    class="chat-window"
    id="chatWindow">


    <!-- ヘッダー -->

    <div class="chat-header">

        <div class="chat-header-title">
            綾時屋サポート
        </div>

        <button
            class="chat-close"
            onclick="toggleChat()">

            ×

        </button>

    </div>


    <!-- =========================
         メッセージ
    ========================= -->

    <div
        class="chat-messages"
        id="chatMessages">

        <div class="message bot-message">

            こんにちは！😊<br>

            <b>綾時屋サポート</b>です。<br><br>

            商品探しやご注文、
            会員ランクなどについて
            お手伝いします。<br><br>

            下のボタンから
            知りたいことを選んでください。

        </div>

    </div>


    <!-- =========================
         よくある質問
    ========================= -->

    <div class="quick-buttons">

        <button
            onclick="quickQuestion('おすすめの商品を教えて')">

            おすすめ商品

        </button>


        <button
            onclick="quickQuestion('商品を探したい')">

            商品を探す

        </button>


        <button
            onclick="quickQuestion('送料はいくらですか')">

            送料について

        </button>


        <button
            onclick="quickQuestion('支払い方法を教えて')">

            支払い方法

        </button>


        <button
            onclick="quickQuestion('注文について知りたい')">

            注文について

        </button>


        <button
            onclick="quickQuestion('会員ランクの特典を教えて')">

            会員ランク

        </button>


        <button
            onclick="quickQuestion('綾町について知りたい')">

            綾町について

        </button>

    </div>


    <!-- =========================
         入力欄
    ========================= -->

    <div class="chat-input-area">

        <input
            type="text"
            id="chatInput"
            class="chat-input"
            placeholder="質問を入力してください..."
            onkeydown="handleKey(event)"
        >

        <button
            class="send-button"
            onclick="sendMessage()">

            送信

        </button>

    </div>

</div>



<script>


/* =========================
   チャットを開閉
========================= */

function toggleChat() {

    const chat =
        document.getElementById("chatWindow");


    if (chat.style.display === "flex") {

        chat.style.display = "none";

    } else {

        chat.style.display = "flex";

    }

}


/* =========================
   メッセージを追加
========================= */

function addMessage(text, type) {

    const messages =
        document.getElementById("chatMessages");


    const message =
        document.createElement("div");


    message.classList.add(
        "message",
        type === "user"
        ? "user-message"
        : "bot-message"
    );


    message.innerHTML = text;


    messages.appendChild(message);


    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================
   ユーザーが送信
========================= */

function sendMessage() {

    const input =
        document.getElementById("chatInput");


    const text =
        input.value.trim();


    if (text === "") {

        return;

    }


    addMessage(text, "user");


    input.value = "";


    setTimeout(function() {

        const answer =
            getAnswer(text);


        addMessage(answer, "bot");

    }, 400);

}


/* =========================
   ボタンから質問
========================= */

function quickQuestion(text) {

    addMessage(text, "user");


    setTimeout(function() {

        const answer =
            getAnswer(text);


        addMessage(answer, "bot");

    }, 400);

}


/* =========================
   Enterキーで送信
========================= */

function handleKey(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

}


/* =========================
   質問に対する回答
========================= */

function getAnswer(text) {

    text = text.toLowerCase();


    /* =========================
       おすすめ商品
    ========================= */

    if (
        text.includes("おすすめ") ||
        text.includes("人気") ||
        text.includes("好み")
    ) {

        return `
        <b>おすすめの商品はこちらです😊</b><br><br>

        🏺 綾の手仕事 陶器マグ<br>
        🧵 手染めのストール<br>
        🍵 職人の小皿<br><br>

        綾時屋では、お客様の購入履歴や
        好みに合わせて、おすすめの商品を
        表示する機能を用意しています。
        `;

    }


    /* =========================
       商品検索
    ========================= */

    if (
        text.includes("商品") &&
        (
            text.includes("探") ||
            text.includes("検索")
        )
    ) {

        return `
        <b>商品を探すことができます🔎</b><br><br>

        商品はジャンルから
        探すことができます。<br><br>

        🏺 陶器<br>
        🧵 染物<br>
        🍴 食品<br>
        🎁 ギフト<br><br>

        商品名から検索することもできます。
        `;

    }


    /* =========================
       送料
    ========================= */

    if (
        text.includes("送料") ||
        text.includes("配送")
    ) {

        return `
        <b>送料について📦</b><br><br>

        会員ランクによって
        送料特典が異なります。<br><br>

        🥉 ブロンズ：送料半額<br>
        🥈 シルバー：送料無料<br>
        🥇 ゴールド：送料無料<br>
        💎 プラチナ：送料無料<br><br>

        詳しい会員ランク特典は
        「会員ランク」から確認できます。
        `;

    }


    /* =========================
       支払い
    ========================= */

    if (
        text.includes("支払い") ||
        text.includes("決済") ||
        text.includes("クレジット") ||
        text.includes("paypay")
    ) {

        return `
        <b>お支払い方法💳</b><br><br>

        以下のお支払い方法に
        対応しています。<br><br>

        ・クレジットカード<br>
        ・代引き<br>
        ・コンビニ払い<br>
        ・PayPay<br><br>

        注文時にお支払い方法を
        選択してください。
        `;

    }


    /* =========================
       注文
    ========================= */

    if (
        text.includes("注文") ||
        text.includes("購入")
    ) {

        return `
        <b>ご注文について🛒</b><br><br>

        ① 商品を選択<br>
        ② カートに入れる<br>
        ③ お届け先を入力<br>
        ④ 支払い方法を選択<br>
        ⑤ 注文を確定<br><br>

        注文完了後、
        商品の発送準備を行います。
        `;

    }


    /* =========================
       会員ランク
    ========================= */

    if (
        text.includes("会員") ||
        text.includes("ランク") ||
        text.includes("特典") ||
        text.includes("ポイント") ||
        text.includes("ブロンズ") ||
        text.includes("シルバー") ||
        text.includes("ゴールド") ||
        text.includes("プラチナ")
    ) {

        return `
        <b>綾時屋 会員ランク特典 ⭐</b><br><br>

        🥉 <b>ブロンズ</b><br>
        送料半額<br><br>

        🥈 <b>シルバー</b><br>
        送料無料<br><br>

        🥇 <b>ゴールド</b><br>
        送料無料 ＋ 5％OFF<br><br>

        💎 <b>プラチナ</b><br>
        送料無料 ＋ 10％OFF<br><br>

        会員ランクが上がるほど、
        お得な特典を受けられます😊
        `;

    }


    /* =========================
       ブロンズ
    ========================= */

    if (text.includes("ブロンズ")) {

        return `
        🥉 <b>ブロンズ会員</b><br><br>

        特典：<br>
        ・送料半額
        `;

    }


    /* =========================
       シルバー
    ========================= */

    if (text.includes("シルバー")) {

        return `
        🥈 <b>シルバー会員</b><br><br>

        特典：<br>
        ・送料無料
        `;

    }


    /* =========================
       ゴールド
    ========================= */

    if (text.includes("ゴールド")) {

        return `
        🥇 <b>ゴールド会員</b><br><br>

        特典：<br>
        ・送料無料<br>
        ・5％OFF
        `;

    }


    /* =========================
       プラチナ
    ========================= */

    if (text.includes("プラチナ")) {

        return `
        💎 <b>プラチナ会員</b><br><br>

        特典：<br>
        ・送料無料<br>
        ・10％OFF
        `;

    }


    /* =========================
       綾町について
    ========================= */

    if (
        text.includes("綾町") ||
        text.includes("観光") ||
        text.includes("宮崎")
    ) {

        return `
        <b>綾町について🌿</b><br><br>

        綾町は宮崎県にある
        自然豊かな地域です。<br><br>

        綾町では陶器や染物など、
        地域の素材や技術を活かした
        ものづくりが行われています。<br><br>

        綾時屋では、綾町の魅力を
        商品と一緒に全国へ届けることを
        目指しています。
        `;

    }


    /* =========================
       在庫
    ========================= */

    if (
        text.includes("在庫") ||
        text.includes("売り切れ")
    ) {

        return `
        <b>在庫について📦</b><br><br>

        商品ページから
        現在の在庫状況を
        確認できます。<br><br>

        在庫が少ない商品については
        「残りわずか」と表示します。
        `;

    }


    /* =========================
       その他
    ========================= */

    return `
        ご質問ありがとうございます😊<br><br>

        申し訳ありませんが、
        その質問については
        現在回答を用意していません。<br><br>

        以下の項目について
        質問してみてください。<br><br>

        ・おすすめ商品<br>
        ・商品を探したい<br>
        ・送料<br>
        ・支払い方法<br>
        ・注文について<br>
        ・会員ランク<br>
        ・綾町について
    `;

}

</script>

</body>
</html>
